[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spoken-order-operator"
version = "0.1.0"
description = "Turn customer order audio into checkout and fulfillment actions with a spoken receipt."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.68,<2",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
order-audio-service = "order_audio_service.run:main"

[tool.setuptools.packages.find]
include = ["order_audio_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
